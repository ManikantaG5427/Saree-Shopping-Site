version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: saree-web-mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: saree_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: saree-web-server
    restart: always
    environment:
      - DATABASE_URL=mongodb://mongodb:27017/saree_db
      - NODE_ENV=production
      - PORT=5000
      - CORS_ORIGIN=http://localhost:5173
      - FRONTEND_URL=http://localhost:5173
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production-min-32-chars
      - JWT_REFRESH_SECRET=your-refresh-secret-change-in-production-min-32-chars
    ports:
      - "5000:5000"
    depends_on:
      - mongodb

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saree-web-frontend
    restart: always
    environment:
      - VITE_API_URL=http://localhost:5000
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mongodb_data: